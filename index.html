<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do list</title>
    <link rel="stylesheet" href="todo.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section class="body">
      <div class="board">
        <h3>To-Do list</h3>

        <form class="taskhead" id="taskForm">
          <input id="task" type="text" placeholder="Add a new task..." autocomplete="off" />
          <button type="submit">Add</button>
        </form>

        <div class="choices">
          <button type="button" class="filter is-active" data-filter="all">All</button>
          <button type="button" class="filter" data-filter="active">Active</button>
          <button type="button" class="filter" data-filter="completed">Completed</button>
        </div>

        <ul class="list" id="list"></ul>

        <div class="message" id="message"><p>No tasks yet. Add one above!</p></div>

        <div class="stats" id="stats" hidden>
          <span id="statsText">0 of 0 tasks completed</span>
          <button type="button" id="clearCompleted">Clear completed</button>
        </div>

        <p class="footer">
          Powered by <a href="https://pinecone.mn/">Pinecone academy</a>
        </p>
      </div>
    </section>

    <script src="todo.js"></script>
  </body>
</html>
